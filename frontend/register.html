<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Орион</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .user-type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .toggle-option {
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
      background: var(--white);
    }
    .toggle-option:hover {
      border-color: var(--accent);
    }
    .toggle-option.active {
      border-color: var(--accent);
      background: rgba(255, 193, 7, 0.1);
    }
    .toggle-option input {
      display: none;
    }
    .toggle-option .icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
      display: block;
    }
    .business-fields {
      background: #f8fafc;
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid var(--accent);
      margin: 20px 0;
      display: none;
    }
    .business-fields.show {
      display: block;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 480px; padding: 40px 20px;">
    <div class="card" style="padding: 32px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);">
      <h2 style="text-align: center; margin-bottom: 8px;">Создать аккаунт</h2>
      <p style="text-align: center; color: var(--text-light); margin-bottom: 24px;">Выберите тип регистрации</p>

      <form id="registerForm">
        <!-- Переключатель типа -->
        <div class="user-type-toggle">
          <label class="toggle-option active" data-type="PRIVATE">
            <input type="radio" name="userType" value="PRIVATE" checked>
            <span class="icon">👤</span>
            <span>Физ. лицо</span>
          </label>
          <label class="toggle-option" data-type="BUSINESS">
            <input type="radio" name="userType" value="BUSINESS">
            <span class="icon">🏢</span>
            <span>Юр. лицо</span>
          </label>
        </div>

        <!-- Общие поля -->
        <div class="form-group">
          <input type="text" id="firstName" placeholder="Имя" required>
        </div>
        <div class="form-group">
          <input type="text" id="lastName" placeholder="Фамилия" required>
        </div>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Пароль" required minlength="6">
        </div>
        <div class="form-group">
          <input type="tel" id="phone" placeholder="Телефон">
        </div>

        <!-- Поля для юр.лица -->
        <div id="businessFields" class="business-fields">
          <h4 style="margin: 0 0 16px; color: var(--primary);">
            <i class="fas fa-building"></i> Реквизиты организации
          </h4>
          <div class="form-group">
            <input type="text" id="companyName" placeholder="Название компании">
          </div>
          <div class="form-row">
            <input type="text" id="inn" placeholder="ИНН">
            <input type="text" id="kpp" placeholder="КПП">
          </div>
          <div class="form-group">
            <textarea id="legalAddress" rows="2" placeholder="Юридический адрес"></textarea>
          </div>
          <div class="form-group">
            <input type="text" id="contactPerson" placeholder="Контактное лицо">
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full" style="margin-top: 20px;">
          Зарегистрироваться
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-light);">
        Уже есть аккаунт? <a href="login.html" style="color: var(--accent); font-weight: 600;">Войти</a>
      </p>
    </div>
  </div>

  <script>
    // Переключение типа пользователя
    document.addEventListener('DOMContentLoaded', () => {
      const toggles = document.querySelectorAll('.toggle-option');
      const businessFields = document.getElementById('businessFields');
      
      toggles.forEach(option => {
        option.addEventListener('click', () => {
          // Убираем активный класс со всех
          toggles.forEach(t => t.classList.remove('active'));
          // Добавляем нажатому
          option.classList.add('active');
          // Устанавливаем radio
          const radio = option.querySelector('input');
          radio.checked = true;
          
          // Показываем/скрываем поля для юр.лица
          if (radio.value === 'BUSINESS') {
            businessFields.classList.add('show');
          } else {
            businessFields.classList.remove('show');
          }
        });
      });
    });
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
